[package]
name = "poros"
version = "1.0.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
urlencoding = "2.1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlFormElement",
    "HtmlStyleElement",
    "Location",
    "Node",
    "Window",
    "Storage",
    "Event",
    "SubmitEvent",
    "Url",
    "UrlSearchParams",
    "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
